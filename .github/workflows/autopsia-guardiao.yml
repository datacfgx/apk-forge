name: autopsia-guardiao

on:
  issues:
    types: [opened]

jobs:
  alertar:
    runs-on: ubuntu-latest
    steps:
      - name: postal de alerta no cofre da familia
        run: |
          TS=$(date -u +%F_%H%M%S)
          NUM="${{ github.event.issue.number }}"
          TITLE="${{ github.event.issue.title }}"
          AUTHOR="${{ github.event.issue.user.login }}"
          URL="${{ github.event.issue.html_url }}"
          MSG="GUARDAO: issue #$NUM aberta no apk-forge — '$TITLE' por $AUTHOR — $URL"
          ENV=$(printf '{"de":"GUARDAO","para":"FAMILIA","ts":"%s","tipo":"texto","mensagem":"%s"}' "$TS" "$MSG")
          B64=$(echo -n "$ENV" | base64 -w0)
          curl -s -X PUT -H "Authorization: Bearer ${{ secrets.ENI_POST_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/datacfgx/cofre-eni/contents/caixa/outbox/GUARDAO/${TS}_FAMILIA.json \
            -d "{\"message\": \"guardiao: issue #$NUM aberta\", \"content\": \"$B64\", \"branch\": \"main\"}"
